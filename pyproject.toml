[project]
name = "olayout"
version = "0.1.0"
description = "2D to-scale optical layout engine for Thorlabs breadboards, with Gaussian beam tracing"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.scripts]
olayout = "olayout.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olayout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
