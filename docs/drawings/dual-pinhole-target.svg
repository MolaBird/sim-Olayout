<line x1="1104.0" y1="40.0" x2="1104.0" y2="268.0" stroke="#111" stroke-width="0.8" fill="none"/>
<text x="1000.0" y="300.0" font-size="14" text-anchor="start" font-weight="bold" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">NOTES</text>
<text x="1000.0" y="322.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">1. Checks both beams at once on the common path after the knife</text>
<text x="1000.0" y="339.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    edge: in hole (8.5, 9.5), face toward KE1, each beam passes its</text>
<text x="1000.0" y="356.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    pinhole. The beams are 7.84 mm apart there (model), centred on</text>
<text x="1000.0" y="373.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    the hole row.</text>
<text x="1000.0" y="394.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">2. Clear anodize keeps the face light, so the HeNe spot shows</text>
<text x="1000.0" y="411.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    around each pinhole. Deburr the pinholes; the face toward the</text>
<text x="1000.0" y="428.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    beams must be burr-free.</text>
<text x="1000.0" y="449.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">3. Engrave one line through both pinhole centres (the beam plane)</text>
<text x="1000.0" y="466.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    and one on the centre line.</text>
<text x="1000.0" y="487.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">4. Post: top at h - 0.600. Turning the post a little moves the</text>
<text x="1000.0" y="504.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    pinholes along the beams, not across them: no need to clock it</text>
<text x="1000.0" y="521.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    precisely.</text>
<text x="1000.0" y="542.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">5. Use it with the HeNe only; take it out for operation (the</text>
<text x="1000.0" y="559.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    pinholes would clip the 2923 beams).</text>
</svg>
