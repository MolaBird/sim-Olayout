<text x="1000.0" y="322.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">1. Stops the 8% strays the imaging pellicles BS4 and BS5 send back</text>
<text x="1000.0" y="339.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    across the board (about 0.2 mW each).</text>
<text x="1000.0" y="360.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">2. Bead blast before anodizing so the face scatters instead of</text>
<text x="1000.0" y="377.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    reflecting. Break sharp edges.</text>
<text x="1000.0" y="398.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">3. Post: top at h - 0.600. BB1 faces its stray square on; BB2 is</text>
<text x="1000.0" y="415.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    turned 30 degrees so it clears BS5's mount (as placed in the</text>
<text x="1000.0" y="432.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#111" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">    layout).</text>
